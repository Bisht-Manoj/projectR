name: Gemini Automated Code Writer
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini_write:
    runs-on: ubuntu-latest
    # Triggers only when you type /gemini-write in a comment
    if: contains(github.event.comment.body, '/gemini-write')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini File Generator
        id: gemini
        uses: google-github-actions/run-gemini-cli@v1
        with:
          api_key: \${{ secrets.GEMINI_API_KEY }}
          # We explicitly command the AI structure to only output code, ensuring it doesn't say "I cannot help you"
          prompt: |
            You are an automated code generator inside a GitHub Actions pipeline. 
            User request: "\${{ github.event.comment.body }}"
            
            Task: Provide ONLY the raw updated code for the requested changes. Do not include conversational text, do not say "I cannot access your system", and do not wrap your answer in markdown code blocks like ```. Just output the raw file contents.

      - name: Apply Changes and Push to Git
        run: |
          # 1. Configure the git bot profile
          git config --global user.name "gemini-bot[bot]"
          git config --global user.email "gemini-bot@://github.com"
          
          # 2. Save Gemini's direct output into your file
          # (For this example, it overwrites main.js. You can change this to any file)
          echo "${{ steps.gemini.outputs.text }}" > main.js
          
          # 3. Stage, commit, and push the changes back to your branch
          git add main.js
          git commit -m "🤖 Auto-code changes written by Gemini"
          git push
